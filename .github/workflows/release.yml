name: release

# Tag vX.Y.Z (the version in package.json) and this stages that version on
# npm from the tagged tree, with npm's provenance: a signed statement, in the
# public transparency log, that this workflow built the package from this
# repository at this tag. `npm audit signatures` checks it on install. A
# staged version goes live only when a maintainer approves it on npmjs.com
# with two-factor authentication.
#
# The stage authenticates as the package's trusted publisher (this
# workflow, configured on npmjs.com), or with the NPM_TOKEN secret when one
# is set.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: The tag is the package's version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run check
      - name: Stage with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --access public
